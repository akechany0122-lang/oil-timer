<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oil Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-link" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#e9ebef;
  --ink:#4e535d; --ink-soft:#8d929c;
  --panel:rgba(255,255,255,.80); --panel-line:rgba(255,255,255,.95); --panel-shadow:0 10px 30px rgba(30,40,60,.10), 0 1px 2px rgba(30,40,60,.06);
  --chip:rgba(30,40,60,.05); --chip-hover:rgba(30,40,60,.10); --chip-on:#30343c; --chip-on-ink:#fff;
  --accent:#2f6bff;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#15171b;
  --ink:#d9dce2; --ink-soft:#8a8f99;
  --panel:rgba(36,39,46,.84); --panel-line:rgba(255,255,255,.08); --panel-shadow:0 12px 34px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3);
  --chip:rgba(255,255,255,.06); --chip-hover:rgba(255,255,255,.12); --chip-on:#e9ebef; --chip-on-ink:#17191d;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Inter","Zen Kaku Gothic New",system-ui,sans-serif;
  color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
canvas.stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.overlay{position:fixed;inset:0;pointer-events:none}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Zen Kaku Gothic New",sans-serif;font-size:13px;letter-spacing:.2em;color:var(--ink-soft);transition:opacity .8s}
.loading.gone{opacity:0;pointer-events:none}

.hint{
  position:fixed;top:34px;left:0;right:0;text-align:center;pointer-events:none;
  font-family:"Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:14px;letter-spacing:.18em;color:var(--ink-soft);
  transition:opacity 1.2s ease;z-index:5;
}
.hint.hidden{opacity:0}

.ot-ui{position:absolute;left:0;top:0;pointer-events:none}
.ot-grip{
  position:absolute;pointer-events:auto;transform:translate(-50%,-50%);
  width:64px;height:22px;border-radius:11px;cursor:move;
  display:flex;align-items:center;justify-content:center;
  background:var(--panel);box-shadow:var(--panel-shadow);border:1px solid var(--panel-line);
  opacity:0;transition:opacity .35s ease;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.ot-grip::before{content:"";width:22px;height:6px;
  background:radial-gradient(circle,var(--ink-soft) 1.2px,transparent 1.6px) 0 0/6px 6px;}
.ot-ui.hover .ot-grip,.ot-ui.moving .ot-grip,.ot-grip:hover{opacity:1}
.ot-hud{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:auto}
.ot-time{
  font-family:"Inter",sans-serif;font-weight:200;font-size:30px;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;color:var(--ink);opacity:.82;line-height:1.1;
  transition:opacity .4s ease,color .4s ease;
}
.ot-sub{font-family:"Zen Kaku Gothic New",sans-serif;font-size:11px;letter-spacing:.2em;color:var(--ink-soft);margin-top:4px;min-height:14px}
.ot-ui.done .ot-time{color:var(--accent);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.ot-panel{
  margin-top:10px;display:inline-flex;flex-direction:column;align-items:center;gap:8px;
  padding:10px 11px;border-radius:16px;background:var(--panel);border:1px solid var(--panel-line);
  box-shadow:var(--panel-shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .35s ease,transform .35s ease;
}
.ot-ui.hover .ot-panel,.ot-hud:hover .ot-panel,.ot-ui.panel-pin .ot-panel{opacity:1;transform:none;pointer-events:auto}
.ot-row{display:flex;gap:4px;align-items:center}
.ot-hint{font-size:10px;color:var(--ink-soft);margin-left:6px;letter-spacing:.05em;font-family:"Zen Kaku Gothic New",sans-serif}
.ot-row.looks{flex-wrap:wrap;max-width:440px}
.ot-row input.yaw{width:170px;accent-color:var(--chip-on)}
body.desktop .ot-row.looks:has(input.yaw){display:flex}
body.desktop .ot-row.looks:has(input.yaw) .ot-hint,body.desktop .ot-row.looks:has(input.yaw) .ot-label{display:none}
body.desktop .ot-row input.yaw{width:150px}
.ot-label{font-family:"Zen Kaku Gothic New",sans-serif;font-size:10px;letter-spacing:.15em;color:var(--ink-soft);width:44px;text-align:left}
.chip{
  border:0;background:var(--chip);border-radius:9px;height:26px;min-width:30px;padding:0 8px;
  font-size:12px;font-weight:400;cursor:pointer;color:var(--ink);transition:background .2s;
  font-variant-numeric:tabular-nums;font-family:"Zen Kaku Gothic New","Inter",sans-serif;
}
.chip:hover{background:var(--chip-hover)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink)}
.chip.icon{display:inline-flex;align-items:center;justify-content:center;padding:0 7px}
.chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.chip.off svg{opacity:.4}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.6), 0 1px 2px rgba(0,0,0,.15)}
.swatch.on{border-color:var(--chip-on)}
.swatch span{position:absolute;inset:0}
.sep{width:1px;height:16px;background:var(--chip-hover);margin:0 3px}
.ot-custom{display:none;align-items:center;gap:4px;font-size:12px;color:var(--ink-soft)}
.ot-custom.show{display:flex}
.ot-custom input{
  width:58px;height:26px;border-radius:9px;border:0;background:var(--chip);color:var(--ink);
  font:inherit;font-size:12px;text-align:center;outline:none;
}

.dock{
  position:fixed;right:22px;bottom:22px;display:flex;gap:6px;padding:6px;border-radius:16px;z-index:10;
  background:var(--panel);border:1px solid var(--panel-line);box-shadow:var(--panel-shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:.55;transition:opacity .3s ease;
}
.dock:hover{opacity:1}
.dock button{
  width:34px;height:34px;border:0;border-radius:11px;background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.dock button:hover{background:var(--chip)}
.dock svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tip{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);font-size:12px;color:var(--ink-soft);
  letter-spacing:.08em;pointer-events:none;opacity:0;transition:opacity .5s;font-family:"Zen Kaku Gothic New",sans-serif;z-index:11;
}
.tip.show{opacity:1}

body.pip .ot-grip,body.pip .ot-sub,body.pip .ot-row.actions,body.pip .ot-row.looks{display:none}
.desk-menu{
  position:fixed;right:22px;bottom:76px;z-index:12;display:none;gap:6px;padding:6px;
  border-radius:16px;background:var(--panel);border:1px solid var(--panel-line);box-shadow:var(--panel-shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.desk-menu.show{display:flex}
.get-app{position:fixed;right:22px;bottom:76px;z-index:13;display:none;flex-direction:column;gap:8px;padding:12px;width:250px;max-width:calc(100vw - 44px);box-sizing:border-box;
  border-radius:16px;background:var(--panel);border:1px solid var(--panel-line);box-shadow:var(--panel-shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink)}
.get-app.show{display:flex}
.get-app p{margin:0;font-size:12px;line-height:1.6;color:var(--ink-soft)}
.get-app .os{display:flex;gap:6px}
.get-app a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:11px;background:var(--chip-on);color:var(--chip-on-ink);
  text-decoration:none;font:500 13px "Inter",sans-serif}
.get-app a svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.get-app small{font-size:10.5px;line-height:1.6;color:var(--ink-soft)}
/* settings: docked at the left on wide screens, a popup above the dock on narrow ones */
.side{position:fixed;left:24px;top:50%;transform:translateY(-50%);z-index:9;opacity:.55;transition:opacity .35s ease}
.side:hover,.side:focus-within,.side:has(.pop.open){opacity:1}
.side .ot-panel{margin:0;opacity:1;transform:none;pointer-events:auto;align-items:stretch}
.side .ot-row{flex-wrap:wrap;max-width:400px;row-gap:5px}
.side .ot-label{width:52px;white-space:nowrap}
.side .ot-row .ot-label + *{margin-left:0}
@media (max-width:520px){.side .ot-row{max-width:none}.side .ot-label{width:100%}.side .ot-row input.yaw{flex:1}}
#setBtn{display:none}
@media (max-width:1099px){
  .side{left:auto;right:22px;top:auto;bottom:76px;transform:translateY(8px);
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease}
  .side.show{opacity:1;transform:none;pointer-events:auto}
  #setBtn{display:flex}
}
.desk-menu button{border:0;background:var(--chip);border-radius:11px;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.desk-menu svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.desk-menu button:hover{background:var(--chip-hover)}
.chip[data-a="quit"]{display:none}
/* desktop window: nothing but the timer and a few controls on hover */
html:has(body.desktop),body.desktop{background:transparent !important}
body.desktop .hint,body.desktop .dock,body.desktop .tip,body.desktop .desk-menu,body.desktop .loading{display:none !important}
body.desktop .ot-grip{display:flex;position:fixed;left:50% !important;top:10px !important;transform:translateX(-50%)}
body.desktop:hover .ot-grip{opacity:1}
body.desktop .ot-ui [data-a="quit"]{display:inline-flex}
body.pip .ot-time{font-size:18px}
body.pip .ot-hud{top:auto !important;bottom:4px;left:50% !important;position:fixed}
body.pip .ot-panel{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);margin:0;padding:6px}
body.pip .ot-hud:hover .ot-panel{transform:translateX(-50%)}
body.pip .ot-row.durations .chip{min-width:24px;padding:0 5px;height:22px;font-size:11px}
body.pip .ot-label{display:none}
/* icon rail + pop-out palettes */
.side .ot-panel.full{position:relative;display:flex;padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.rail{display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:20px;background:var(--panel);border:1px solid var(--panel-line);
  box-shadow:var(--panel-shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.rb{position:relative;width:40px;height:40px;border:0;border-radius:13px;background:transparent;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s}
.rb:hover,.rb.on-pop{background:var(--chip)}
.rb svg,.pi svg,.prow>svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rb.off svg{opacity:.32}
.rb .cur-design{display:flex;height:32px}
.rb .cur-design svg{width:auto;height:32px}
.cur-color{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 1px 2px rgba(255,255,255,.6),0 1px 2px rgba(0,0,0,.2)}
.cur-min{position:absolute;right:1px;bottom:1px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;box-sizing:border-box;
  background:var(--chip-on);color:var(--chip-on-ink);font:600 9px/15px "Inter",sans-serif;text-align:center}
.rsep{display:block;height:1px;margin:4px 8px;background:var(--chip-hover)}
.pop{position:absolute;left:calc(100% + 10px);top:50%;transform:translate(-4px,-50%);display:flex;gap:5px;align-items:center;padding:8px;
  border-radius:18px;background:var(--panel);border:1px solid var(--panel-line);box-shadow:var(--panel-shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;white-space:nowrap}
.pop.open{opacity:1;pointer-events:auto;transform:translate(0,-50%)}
.pop.col{flex-direction:column;align-items:stretch}
@media (max-width:1099px){
  .pop{left:auto;right:calc(100% + 8px);top:auto;bottom:0;transform:translate(4px,0);flex-wrap:wrap;white-space:normal;width:max-content;max-width:calc(100vw - 100px)}
  .pop.open{transform:none}
  .pop.col{width:auto}
}
.prow{display:flex;gap:5px;align-items:center}
.prow>svg{width:18px;height:18px;color:var(--ink-soft);flex:none}
.prow input.yaw{flex:1;width:auto;min-width:110px;accent-color:var(--chip-on)}
.pi{width:36px;height:36px;border:0;border-radius:11px;background:var(--chip);color:var(--ink);cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;font:400 13px "Inter",sans-serif;font-variant-numeric:tabular-nums;transition:background .2s}
.pi:hover{background:var(--chip-hover)}
.pi.on{background:var(--chip-on);color:var(--chip-on-ink)}
.psep{width:1px;height:22px;background:var(--chip-hover);margin:0 2px}
.dz{width:38px;height:64px;border:0;border-radius:11px;background:var(--chip);color:var(--ink);cursor:pointer;padding:5px;flex:none;
  display:flex;align-items:center;justify-content:center;transition:background .2s}
.dz:hover{background:var(--chip-hover)}
.dz.on{background:var(--chip-on);color:var(--chip-on-ink)}
.dz svg{height:100%;width:auto}
svg .dg-o{fill:none;stroke:currentColor;stroke-width:13}
svg .dg-q{fill:currentColor;stroke:none;opacity:.55}
svg .dg-l{fill:none;stroke:currentColor;stroke-width:11;stroke-linecap:round}
svg .dg-p{fill:currentColor;stroke:none}
.pop .ot-custom{display:none}
.pop .ot-custom.show{display:flex}
.pop .ot-custom input{width:54px;height:36px;border-radius:11px}
.ot-sub{display:none}
.hint{display:flex;justify-content:center;gap:26px;top:auto;bottom:34px}
@media (max-width:640px){.hint{justify-content:flex-start;gap:14px;padding-left:16px;top:14px;bottom:auto}.hint svg{width:17px;height:17px}}
.hint span{display:flex;gap:4px;align-items:center}
.hint svg{width:20px;height:20px;stroke:var(--ink-soft);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* the main control: turn the timer over */
.ot-flip{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;width:46px;height:46px;padding:0;border:0;border-radius:50%;cursor:pointer;
  background:var(--chip-on);color:var(--chip-on-ink);font-family:"Zen Kaku Gothic New",sans-serif;font-size:12px;letter-spacing:.14em;
  box-shadow:var(--panel-shadow);transition:transform .15s ease,opacity .2s ease}
.ot-flip:hover{transform:translateY(-1px)}
.ot-flip:active{transform:scale(.96)}
.ot-flip svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
body.pip:not(.desktop) .ot-flip{display:none}
.ot-ui.ready .ot-flip{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:var(--panel-shadow),0 0 0 0 color-mix(in srgb,var(--chip-on) 35%,transparent)}50%{box-shadow:var(--panel-shadow),0 0 0 8px transparent}}
/* desktop window: the timer above, a small control area below it */
body.desktop .ot-hud{position:fixed;left:0 !important;right:0;top:auto !important;bottom:0;transform:none;height:112px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;padding-bottom:8px}
body.desktop .ot-time{font-size:22px;font-weight:300;opacity:.95;text-shadow:0 1px 8px rgba(255,255,255,.8)}
:root[data-theme="dark"] body.desktop .ot-time{text-shadow:0 1px 8px rgba(0,0,0,.8)}
body.desktop .ot-sub{display:none}
body.desktop .ot-flip{margin-top:0;width:42px;height:42px}
body.desktop .ot-panel{position:static;transform:none !important;margin:0;padding:3px 5px;border-radius:12px;flex-direction:row;gap:6px;opacity:0;pointer-events:none}
body.desktop:hover .ot-panel{opacity:1;pointer-events:auto}
body.desktop .ot-row.looks,body.desktop .ot-custom,body.desktop [data-m="custom"],body.desktop .ot-panel [data-a="flip"],
body.desktop [data-a="pip"],body.desktop .ot-row.actions .sep{display:none !important}
body.desktop .ot-row{gap:3px}
body.desktop .ot-row.actions{display:flex;padding-left:6px;border-left:1px solid var(--chip-hover)}
body.desktop .ot-panel .chip{height:22px;min-width:22px;padding:0 4px;font-size:11px;border-radius:7px}
</style>
<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

<body>
<div class="loading" id="loading">LOADING</div>
<div class="hint" id="hint">
  <span title="上下にドラッグでひっくり返す"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/></svg><svg viewBox="0 0 24 24"><path d="M19.4 9A8 8 0 0 0 5.6 6.8M4.6 15a8 8 0 0 0 13.8 2.2"/><path d="M5 3.5v3.6h3.6M19 20.5v-3.6h-3.6"/><path d="M9.5 7.5h5l-2.5 4.5 2.5 4.5h-5l2.5-4.5z"/></svg></span>
  <span title="左右にドラッグで奥行きを見る"><svg viewBox="0 0 24 24"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg><svg viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg></span>
</div>
<div class="tip" id="tip"></div>
<div class="desk-menu" id="deskMenu">
  <button id="deskApp" title="背景なしでデスクトップに置く（アプリ）"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2" stroke-dasharray="2.2 2.2"/><path d="M8 21h8M12 17v4"/><rect x="10" y="6.5" width="4" height="8" rx="1.2"/></svg></button>
  <button id="deskPip" title="ブラウザの小窓で置く（Chrome / Edge）"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12" y="11" width="7" height="6" rx="1.2"/></svg></button>
</div>
<div class="get-app" id="getApp">
  <p>背景なしで置くには、無料のデスクトップアプリを使います。インストール後に一度起動すると、次からはこのボタンで開きます。</p>
  <div class="os">
    <a id="dlMac" href="https://github.com/akechany0122-lang/oil-timer/releases/download/desktop/OilTimer-mac.zip"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>Mac</a>
    <a id="dlWin" href="https://github.com/akechany0122-lang/oil-timer/releases/download/desktop/OilTimer-Setup-win.exe"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>Windows</a>
  </div>
  <small>Mac：初回は「システム設定 → プライバシーとセキュリティ → このまま開く」を選びます。<br>Windows：警告が出たら「詳細情報 → 実行」を選びます。</small>
</div>
<div class="side" id="side"></div>
<div class="dock">
  <button id="setBtn" title="設定"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  <button id="deskBtn" title="デスクトップに置く"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="M12 7v5M9.5 9.5 12 12l2.5-2.5"/></svg></button>
  <button id="themeBtn" title="ライト / ダーク"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  <button id="fsBtn" title="フルスクリーン"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<script type="module">
import * as THREE from 'three';
// desktop mode: the timer alone on a transparent, always-on-top window (Mac app)
const DESKTOP = new URLSearchParams(location.search).has('desktop');

    this.caps = this.segs.map(([a, b, w]) => prepCap([P(a), P(b)], w));
  }
  integrate(gx, gy) {
    let acc = this.tau / this.I;
    if (this.spring) acc -= this.spring * (this.phi - this.rest);
    if (this.grav) acc -= this.grav * Math.sin(this.phi - (Math.atan2(gy, gx) - this.arm));
    this.omega = Math.max(-this.maxW, Math.min(this.maxW, (this.omega + acc) * this.damp));

    if (this.lim != null) {
      if (this.phi > this.rest + this.lim) { this.phi = this.rest + this.lim; if (this.omega > 0) this.omega *= -0.25; }
      else if (this.phi < this.rest - this.lim) { this.phi = this.rest - this.lim; if (this.omega < 0) this.omega *= -0.25; }
    }
    this.update();
  }
}

class Sim {
  constructor(cap, color, D) {
    this.cap = cap; this.n = 0; this.color = color;
    this.D = D; this.caps = D.caps[color]; this.gates = D.gates[color]; this.drag = D.def.drag; this.xsph = D.def.xsph ?? XSPH;
    this.rotors = D.rotors[color].map(r => new Rotor(r));
    this.impacts = [];
    // contact counters (used to check that every part of a design actually gets oil)
    this.capHits = new Uint32Array(this.caps.length); this.rotHits = new Uint32Array(this.rotors.length); this.touched = new Uint8Array(cap);
    const F = () => new Float32Array(cap);
    this.px = F(); this.py = F(); this.vx = F(); this.vy = F(); this.ox = F(); this.oy = F();
    this.tx = F(); this.ty = F();
    this.hold = new Uint8Array(cap);
    this.pass = new Int8Array(cap).fill(-1);
    this.passT = new Int16Array(cap);
    this.gx = 0; this.gy = 1; this.hx = 0; this.hy = 0;
    this.gateOpen = [false, false];
    this.gc = Math.ceil((W + 40) / HS); this.gr = Math.ceil((H + 40) / HS);
    this.cellStart = new Int32Array(this.gc * this.gr + 1);
    this.cellFill = new Int32Array(this.gc * this.gr);
    this.cellItems = new Int32Array(cap);
    this.cellOf = new Int32Array(cap);
    this.nbStart = new Int32Array(cap + 1);
    this.nb = new Int32Array(cap * 56);
    this.hasNb = false;
  }
  add(x, y) {
    const i = this.n++;
    this.px[i] = this.ox[i] = x; this.py[i] = this.oy[i] = y;
    this.vx[i] = this.vy[i] = 0; this.pass[i] = -1; this.hold[i] = 0;
    return i;
  }
  buildNb() {
    const { n, px, py, gc, gr, cellStart, cellFill, cellItems, cellOf, nbStart, nb } = this;
    cellStart.fill(0);
    for (let i = 0; i < n; i++) {
      let cx = ((px[i] + 20) / HS) | 0, cy = ((py[i] + 20) / HS) | 0;
      cx = cx < 0 ? 0 : cx >= gc ? gc - 1 : cx; cy = cy < 0 ? 0 : cy >= gr ? gr - 1 : cy;
      const c = cy * gc + cx; cellOf[i] = c; cellStart[c + 1]++;
    }
    for (let c = 0; c < gc * gr; c++) cellStart[c + 1] += cellStart[c];
    cellFill.fill(0);
    for (let i = 0; i < n; i++) { const c = cellOf[i]; cellItems[cellStart[c] + cellFill[c]++] = i; }
    let k = 0; const maxK = nb.length;
    for (let i = 0; i < n; i++) {
      nbStart[i] = k;
      const c = cellOf[i], cx = c % gc, cy = (c / gc) | 0, xi = px[i], yi = py[i];
      for (let yy = cy - 1; yy <= cy + 1; yy++) {
        if (yy < 0 || yy >= gr) continue;
        for (let xx = cx - 1; xx <= cx + 1; xx++) {
          if (xx < 0 || xx >= gc) continue;
          const cc = yy * gc + xx;
          for (let s = cellStart[cc], e = cellStart[cc + 1]; s < e; s++) {
            const j = cellItems[s];
            if (j === i) continue;
            const dx = px[j] - xi, dy = py[j] - yi;
            if (dx * dx + dy * dy < HS2 && k < maxK) nb[k++] = j;
          }
        }
      }
    }
    nbStart[n] = k;
    this.hasNb = true;
  }
  relax() {
    const { n, px, py, nb, nbStart } = this;
    for (let i = 0; i < n; i++) {
      let rho = 0, rhoN = 0;
      const xi = px[i], yi = py[i];
      for (let k = nbStart[i], e = nbStart[i + 1]; k < e; k++) {
        const j = nb[k], dx = px[j] - xi, dy = py[j] - yi, r2 = dx * dx + dy * dy;
        if (r2 < HS2) { const q = 1 - Math.sqrt(r2) / HS; rho += q * q; rhoN += q * q * q; }
      }
      const P = K_P * (rho - RHO0), PN = K_N * rhoN;
      let dxi = 0, dyi = 0;
      for (let k = nbStart[i], e = nbStart[i + 1]; k < e; k++) {
        const j = nb[k], dx = px[j] - xi, dy = py[j] - yi, r2 = dx * dx + dy * dy;
        if (r2 < HS2 && r2 > 1e-8) {
          const r = Math.sqrt(r2), q = 1 - r / HS;
          const Dd = (P * q + PN * q * q) * 0.5, ux = dx / r * Dd, uy = dy / r * Dd;
          px[j] += ux; py[j] += uy; dxi -= ux; dyi -= uy;
        }
      }
      px[i] = xi + dxi; py[i] = yi + dyi;
    }
  }
  collide(i) {
    let x = this.px[i], y = this.py[i], hit = false, nx = 0, ny = 0;
    const d = this.D.shape.sd(x, y, true);
    if (d > -PR) { x -= OUT.nx * (d + PR); y -= OUT.ny * (d + PR); hit = true; nx = -OUT.nx; ny = -OUT.ny; }
    const Q = this.D.quads;
    for (let k = 0; k < Q.length; k++) {
      if (pushPoly(Q[k], x, y, PR)) { x = OUT.x; y = OUT.y; hit = true; nx = OUT.nx; ny = OUT.ny; }
    }
    const R = this.caps;
    for (let k = 0; k < R.length; k++) {
      if (pushCap(R[k], x, y, PR)) { x = OUT.x; y = OUT.y; hit = true; nx = OUT.nx; ny = OUT.ny; this.capHits[k]++; this.touched[i] = 1; }
    }
    for (let r = 0; r < this.rotors.length; r++) {
      const wh = this.rotors[r];
      if (wh.hubCap && pushCap(wh.hubCap, x, y, PR)) { x = OUT.x; y = OUT.y; hit = true; nx = OUT.nx; ny = OUT.ny; }
      for (let k = 0; k < wh.caps.length; k++) {
        if (pushCap(wh.caps[k], x, y, PR)) {
          this.rotHits[r]++; this.touched[i] = 1;
          const dx = OUT.x - x, dy = OUT.y - y, rx = x - wh.cx, ry = y - wh.cy;
          wh.tau -= rx * dy - ry * dx;            // the push on the oil pushes the paddle back
          x = OUT.x; y = OUT.y; hit = true; nx = OUT.nx; ny = OUT.ny;
        }
      }
    }
    const pg = this.pass[i];
    for (let k = 0; k < 2; k++) {
      if (this.gateOpen[k] || pg === k) continue;
      if (pushCap(this.gates[k], x, y, PR)) { x = OUT.x; y = OUT.y; hit = true; nx = OUT.nx; ny = OUT.ny; }
    }
    if (hit) {
      // a fast drop hitting a surface head-on throws a few tiny droplets
      const vx0 = this.vx[i], vy0 = this.vy[i], sp = Math.hypot(vx0, vy0);
      if (sp > 0.7 && vx0 * nx + vy0 * ny < -0.55 * sp && this.impacts.length < 8 && !this.hold[i]) this.impacts.push([x, y, vx0, vy0, nx, ny]);
      const mx = x - this.ox[i], my = y - this.oy[i], dn = mx * nx + my * ny;
      x -= (mx - dn * nx) * FRIC; y -= (my - dn * ny) * FRIC;
    }
    this.px[i] = x; this.py[i] = y;
  }
  step() {
    const { n, px, py, vx, vy, ox, oy, tx, ty, nb, nbStart, hold } = this;
    const gx = this.gx * GRAV, gy = this.gy * GRAV, damp = 1 - this.drag;
    for (let i = 0; i < n; i++) { vx[i] = (vx[i] + gx) * damp; vy[i] = (vy[i] + gy) * damp; }
    if (this.hasNb) {
      for (let i = 0; i < n; i++) {
        let sx = 0, sy = 0;
        for (let k = nbStart[i], e = nbStart[i + 1]; k < e; k++) {
          const j = nb[k], dx = px[j] - px[i], dy = py[j] - py[i], r2 = dx * dx + dy * dy;
          if (r2 < HS2) { const q = 1 - Math.sqrt(r2) / HS, w = q * q; sx += (vx[j] - vx[i]) * w; sy += (vy[j] - vy[i]) * w; }
        }
        tx[i] = sx; ty[i] = sy;
      }
      const xs = this.xsph;
      for (let i = 0; i < n; i++) { vx[i] += xs * tx[i]; vy[i] += xs * ty[i]; }
    }
    for (let i = 0; i < n; i++) { ox[i] = px[i]; oy[i] = py[i]; px[i] += vx[i]; py[i] += vy[i]; }
    this.buildNb();
    this.relax();
    for (let i = 0; i < n; i++) this.collide(i);
    for (const r of this.rotors) r.integrate(this.gx, this.gy);
    const hx = this.hx, hy = this.hy;      // a drop being born, held under the nozzle
    for (let i = 0; i < n; i++) if (hold[i]) { px[i] += (hx - px[i]) * 0.035; py[i] += (hy - py[i]) * 0.035; }
    const pass = this.pass, passT = this.passT;
    for (let i = 0; i < n; i++) {
      let ux = px[i] - ox[i], uy = py[i] - oy[i];
      const s2 = ux * ux + uy * uy;
      if (s2 > VMAX * VMAX) { const f = VMAX / Math.sqrt(s2); ux *= f; uy *= f; }
      vx[i] = ux; vy[i] = uy;
      if (pass[i] >= 0 && !hold[i] && --passT[i] <= 0) pass[i] = -1;
    }
  }
}

/* =====================================================================
   4. Timer model: physics + clock + rotation (no rendering)
   ===================================================================== */
class TimerModel {
  constructor(app, { cfg = {}, state = null, fresh = false }) {
    this.app = app;
    this.cfg = Object.assign({ x: 0, y: 0.25, scale: 1, duration: 180, sound: true, design: 'cross', palette: 'classic', glitter: false, view: { yaw: 0, pitch: 0 } }, cfg);
    if (!DESIGN_DEFS[this.cfg.design]) this.cfg.design = 'cross';
    if (!PALETTES[this.cfg.palette]) this.cfg.palette = 'classic';
    this.theta = 0; this.omega = 0; this.target = 0; this.dragging = false;
    this.views = new Set();
    this.build();
    if (state) this.restore(state); else this.fill(fresh ? 'top' : 'bottom');
  }
  build() {
    this.D = getDesign(this.cfg.design);
    this.nPer = this.D.nPer;
    this.sims = [new Sim(this.nPer, 0, this.D), new Sim(this.nPer, 1, this.D)];
    this.expect = [0, 0]; this.expGate = [-1, -1]; this.holdGoal = [0, 0]; this.stepAcc = 0; this.debt = [0, 0];
    this.wasRunning = false; this.done = false; this.remaining = 0; this.chimedEarly = false; this.anyTop = false;
  }
  setDesign(id) {
    if (id === this.cfg.design) return;
    this.cfg.design = id;
    this.build();
    this.theta = this.target = Math.round(this.target / Math.PI) * Math.PI; this.omega = 0;
    this.updateGravity();
    // start right away with the oil on top
    this.fill('top');
    this.views.forEach(v => v.rebuildDesign());
    this.app.save();
  }
  // 'top' = the chamber the oil runs out of in the current orientation (for
  // rising oil that is the lower one); filled from where the oil settles
  fill(where) {
    const th = this.physTheta(), down = Math.cos(th) > 0;
    this.sims.forEach((sim, c) => {
      sim.n = 0;
      let src = this.staticTopGate(c); if (src < 0) src = 0;
      const k = where === 'top' ? src : 1 - src;
      const slots = this.D.slots[c][k];
      const ordered = down ? slots : slots.slice().reverse();
      for (let k = 0; k < this.nPer; k++) sim.add(ordered[k][0] + (Math.random() - .5) * .3, ordered[k][1] + (Math.random() - .5) * .3);
    });
    this.expect = [0, 0]; this.expGate = [-1, -1]; this.debt = [0, 0];
  }
  serialize() {
    const r = v => Math.round(v * 10) / 10;
    return {
      sims: this.sims.map(s => ({ px: Array.from(s.px.subarray(0, s.n), r), py: Array.from(s.py.subarray(0, s.n), r) })),
      theta: this.target, expect: this.expect.map((e, c) => e + this.debt[c]), expGate: this.expGate.slice(),
      wasRunning: this.wasRunning, done: this.done, runSide: this.runSide, t: Date.now(),
    };
  }
  restore(st) {
    if (!st || !st.sims || st.sims.some(s => s.px.length !== this.nPer)) { this.fill('bottom'); return; }
    this.sims.forEach((sim, c) => { sim.n = 0; st.sims[c].px.forEach((x, i) => sim.add(x, st.sims[c].py[i])); });
    const th = Math.round((st.theta || 0) / Math.PI) * Math.PI;
    this.theta = this.target = th; this.omega = 0;
    this.expect = st.expect || [0, 0]; this.expGate = st.expGate || [-1, -1]; this.debt = [0, 0];
    this.wasRunning = !!st.wasRunning; this.done = !!st.done; this.runSide = st.runSide ?? Math.round(th / Math.PI);
    this.updateGravity();
    for (let k = 0; k < 120; k++) { this.updateGates(true); this.sims.forEach(s => s.step()); }
    const away = (Date.now() - (st.t || Date.now())) / 1000;
    if (away > 0.5) this.catchUp(Math.min(away, 36000), true);
  }
  setDuration(sec) { this.cfg.duration = sec; this.done = false; this.app.save(); }

  dragStart(px, py, t) { this.dragging = true; this.omega = 0; this.pLast = { x: px, y: py, t }; }
  dragMove(px, py, cx, cy, t) {
    if (!this.dragging) return;
    const rx = px - cx, ry = py - cy, dx = px - this.pLast.x, dy = py - this.pLast.y;
    const rr = Math.max(rx * rx + ry * ry, 120 * 120);
    let dth = (rx * dy - ry * dx) / rr;
    const ax = Math.abs(rx);
    if (ax < 70) dth += dy * (1 - ax / 70) / 240;
    this.theta += dth;
    const dt = Math.max(1, t - this.pLast.t) / 1000;
    this.omega = this.omega * 0.6 + (dth / dt) * 0.4;
    this.pLast = { x: px, y: py, t };
  }
  dragEnd(t) {
    if (!this.dragging) return;
    this.dragging = false;
    if (t - this.pLast.t > 120) this.omega = 0;
    const proj = this.theta + Math.max(-6, Math.min(6, this.omega)) * 0.32;
    this.target = Math.round(proj / Math.PI) * Math.PI;
  }
  flip() { this.target = Math.round(this.target / Math.PI) * Math.PI + Math.PI; }
  updateRotation(dt) {
    if (this.dragging) return;
    const K = 9, C = 5.4;
    const steps = Math.ceil(dt / 0.008), h = dt / steps;
    for (let i = 0; i < steps; i++) {
      this.omega += (K * (this.target - this.theta) - C * this.omega) * h;
      this.theta += this.omega * h;
    }
    if (Math.abs(this.target - this.theta) < 1e-4 && Math.abs(this.omega) < 1e-3) { this.theta = this.target; this.omega = 0; }
  }
  settled() {
    if (this.dragging) return false;
    const k = Math.round(this.theta / Math.PI);
    return Math.abs(this.theta - k * Math.PI) < 0.07 && Math.abs(this.omega) < 0.6;
  }
  // oil lighter than the water around it (bubble type) feels gravity the other way
  physTheta() { return this.theta + (this.D.def.buoyant ? Math.PI : 0); }
  updateGravity() { const th = this.physTheta(), gx = Math.sin(th), gy = Math.cos(th); this.sims.forEach(s => { s.gx = gx; s.gy = gy; }); }
  gateS(g) {
    const rx = g.cx - CX, ry = g.cy - CY, th = this.physTheta();
    return (rx * Math.sin(th) + ry * Math.cos(th)) / Math.hypot(rx, ry);
  }
  updateGates(force = false) {
    const st = force || this.settled();
    this.sims.forEach(s => { for (let k = 0; k < 2; k++) s.gateOpen[k] = st && this.gateS(s.gates[k]) > 0.3; });
  }
  staticTopGate(c) { for (let k = 0; k < 2; k++) if (this.gateS(this.D.gates[c][k]) < -0.6) return k; return -1; }
  topGate(c) { return this.settled() ? this.staticTopGate(c) : -1; }

  rate() { return this.nPer / this.cfg.duration; }
  // oil through the nozzle never gets slower than a ~3.5 minute timer; on longer
  // timers part of what lands is quietly returned to the top pool, so the pools
  // fill and empty slowly while the drops keep their rhythm
  flux() { return Math.max(this.rate(), this.nPer / 210); }
  kDrop() { return Math.round(Math.max(3, Math.min(8, Math.round(this.flux() * 1.6))) * this.D.def.kScale); }
  // move k settled particles from deep in the lower pool to the surface of the upper one
  recycle(c, g, k) {
    const s = this.sims[c], Gt = this.D.gates[c][g], Gb = this.D.gates[c][1 - g], gx = s.gx, gy = s.gy;
    const low = [], top = [];
    for (let i = 0; i < s.n; i++) {
      if (s.hold[i]) continue;
      const x = s.px[i], y = s.py[i], d = x * gx + y * gy;
      if (inRegion(Gb, x, y)) { if (s.pass[i] < 0 || s.passT[i] < 220) low.push([d, i]); }
      else if (s.pass[i] < 0 && inRegion(Gt, x, y)) top.push([d, i]);
    }
    low.sort((a, b) => b[0] - a[0]); top.sort((a, b) => a[0] - b[0]);
    let moved = 0;
    for (; moved < k && low.length; moved++) {
      const [, i] = low.splice(Math.floor(Math.random() * Math.min(low.length, 4 + low.length / 3)), 1)[0];
      let bx, by;
      if (top.length) { const r = top[Math.floor(Math.random() * Math.min(top.length, 8))][1]; bx = s.px[r]; by = s.py[r]; }
      else { bx = Gt.cx - gx * 10; by = Gt.cy - gy * 10; }
      const j = (Math.random() - 0.5) * 2.4;
      const x = bx - gx * 1.8 - gy * j, y = by - gy * 1.8 + gx * j;
      s.px[i] = s.ox[i] = x; s.py[i] = s.oy[i] = y; s.vx[i] = s.vy[i] = 0;
      s.pass[i] = -1; s.passT[i] = 0; s.touched[i] = 0;
    }
    return moved;
  }
  topCount(c, g) {
    const s = this.sims[c], G = this.D.gates[c][g];
    let n = 0;
    for (let i = 0; i < s.n; i++) if (s.pass[i] < 0 && inRegion(G, s.px[i], s.py[i])) n++;
    return n;
  }
  feedDrop(c, g, k) {
    const s = this.sims[c], G = this.D.gates[c][g], cand = [];
    for (let i = 0; i < s.n; i++) {
      if (s.pass[i] >= 0 || !inRegion(G, s.px[i], s.py[i])) continue;
      const dx = s.px[i] - G.cx, dy = s.py[i] - G.cy;
      cand.push([dx * dx + dy * dy, i]);
    }
    cand.sort((a, b) => a[0] - b[0]);
    for (let j = 0; j < Math.min(k, cand.length); j++) { const i = cand[j][1]; s.pass[i] = g; s.hold[i] = 1; }
  }
  heldCount(c) { const s = this.sims[c]; let n = 0; for (let i = 0; i < s.n; i++) n += s.hold[i]; return n; }
  dropHeld(c) { const s = this.sims[c]; for (let i = 0; i < s.n; i++) if (s.hold[i]) { s.hold[i] = 0; s.passT[i] = 400; } }
  // the clock is authoritative: expect[c] is how much oil should still be up top;
  // oil gathers into a drop hanging at the nozzle, which lets go once it is big enough
  tickTimer(dt) {
    const rate = this.rate(), F = this.flux(), K = this.kDrop();
    let anyTop = false, rem = 0;
    for (let c = 0; c < 2; c++) {
      const s = this.sims[c], g = this.topGate(c);
      if (g < 0) { this.expGate[c] = -1; this.dropHeld(c); continue; }
      anyTop = true;
      const G = this.D.gates[c][g];
      const j = this.jit?.[c] || 0;
      s.hx = G.cx + s.gx * 7 + s.gy * j; s.hy = G.cy + s.gy * 7 - s.gx * j;

      // what is owed back to the top pool (long timers) goes back as soon as there is oil below
      if (this.debt[c] >= 1) { const k = this.recycle(c, g, Math.min(3, Math.floor(this.debt[c]))); this.debt[c] -= k; this.expect[c] += k; }
      let n = this.topCount(c, g);
      const total = this.expect[c] + this.debt[c];
      this.expect[c] = Math.max(0, Math.min(this.expect[c], n) - F * dt);
      this.debt[c] = Math.max(0, total - rate * dt - this.expect[c]);
      const want = Math.min(4, Math.floor(n - this.expect[c]));
      if (want > 0) { this.feedDrop(c, g, want); n -= want; }
      const held = this.heldCount(c);
      // the last drop clings to the nozzle until the clock runs out
      if (held >= this.holdGoal[c] || (n === 0 && held > 0 && (this.expect[c] + this.debt[c]) / rate < 0.8)) { this.dropHeld(c); this.holdGoal[c] = K; (this.jit ||= [0, 0])[c] = (Math.random() - 0.5) * 8; }
      rem = Math.max(rem, (this.expect[c] + this.debt[c]) / rate);
    }

      const side = Math.round(this.theta / Math.PI);
      if (rem > 1e-4) {
        if (!this.wasRunning) this.chimedEarly = false;
        this.wasRunning = true; this.runSide = side; this.done = false;
        this.remaining = rem;
      } else if (this.wasRunning) {
        this.wasRunning = false; this.remaining = 0;
        if (side === this.runSide) this.finish();
      }
    }
    this.anyTop = anyTop;
  }
  finish() {
    this.done = true;
    if (this.cfg.sound && !this.chimedEarly) this.app.chime();
    this.chimedEarly = false;
  }
  catchUp(sec, quiet = false) {
    const rate = this.rate();
    let moved = false;
    for (let c = 0; c < 2; c++) {
      const s = this.sims[c];
      const g = this.topGate(c) >= 0 ? this.topGate(c) : (quiet ? this.staticTopGate(c) : -1);
      if (g < 0) continue;
      this.dropHeld(c);
      const G = this.D.gates[c][g], cand = [];
      for (let i = 0; i < s.n; i++) {
        if (inRegion(G, s.px[i], s.py[i])) { const dx = s.px[i] - G.cx, dy = s.py[i] - G.cy; cand.push([dx * dx + dy * dy, i]); }
      }
      if (this.expGate[c] !== g) { this.expGate[c] = g; this.expect[c] = cand.length; this.debt[c] = 0; }
      this.expect[c] = Math.min(cand.length, Math.max(0, this.expect[c] + this.debt[c] - rate * sec)); this.debt[c] = 0;
      const k = cand.length - Math.ceil(this.expect[c]);
      if (k <= 0) continue;
      cand.sort((a, b) => a[0] - b[0]);
      const slots = this.D.slots[c][1 - g];
      const sorted = s.gy > 0 ? slots : slots.slice().reverse();
      let si = 0;
      for (let j = 0; j < k; j++) {
        const i = cand[j][1];
        while (si < sorted.length) {
          const p = sorted[si++];
          let free = true;
          for (let q = 0; q < s.n && free; q++) { const dx = s.px[q] - p[0], dy = s.py[q] - p[1]; if (dx * dx + dy * dy < 12) free = false; }
          if (free) { s.px[i] = s.ox[i] = p[0]; s.py[i] = s.oy[i] = p[1]; s.vx[i] = s.vy[i] = 0; s.pass[i] = -1; break; }
        }
      }
      moved = true;
    }
    if (moved) for (let k = 0; k < 60; k++) { this.updateGates(true); this.sims.forEach(s => s.step()); }
  }
  remainingFromState() { return Math.max(...this.expect.map((e, c) => this.expGate[c] >= 0 ? e + this.debt[c] : 0)) / this.rate(); }
  update(dt) {
    if (dt > 0.5) { this.catchUp(dt); dt = 0.016; }
    dt = Math.min(dt, 0.05);
    this.updateRotation(dt);
    this.updateGravity();
    this.updateGates();
    this.stepAcc += dt * STEPS_PER_SEC;
    let k = 0;
    while (this.stepAcc >= 1 && k < 8) { this.sims[0].step(); this.sims[1].step(); this.stepAcc -= 1; k++; }
    if (this.stepAcc > 2) this.stepAcc = 0;
    this.tickTimer(dt);
  }
}

function roundedRect(path, w, h, r) {
  const x = -w / 2, y = -h / 2;
  path.moveTo(x + r, y);
  path.lineTo(x + w - r, y); path.absarc(x + w - r, y + r, r, -Math.PI / 2, 0, false);
  path.lineTo(x + w, y + h - r); path.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2, false);
  path.lineTo(x + r, y + h); path.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI, false);
  path.lineTo(x, y + r); path.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5, false);
  return path;
}
function capsuleShape(a, b, r) {
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  const s = new THREE.Shape();
  s.absarc(b[0], b[1], r, ang - Math.PI / 2, ang + Math.PI / 2, false);
  s.absarc(a[0], a[1], r, ang + Math.PI / 2, ang + Math.PI * 1.5, false);
  return s;
}
function circleShape(c, r) { const s = new THREE.Shape(); s.absarc(c[0], c[1], r, 0, Math.PI * 2, false); return s; }

const GLSL_NOISE = `
float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash21(i), hash21(i + vec2(1, 0)), f.x), mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), f.x), f.y); }

`;

/* Refractive glass: the base material contributes only its reflections; the
   light coming through is taken from the buffer of what lies behind, bent by
   the surface normal (stronger on the bevels), split slightly by colour
   (dispersion), tinted green-blue toward the edges like thick acrylic, and
   darkened where rays bend past the critical angle at the rims. */
const GLASS_PARS = `
uniform sampler2D uBuf; uniform vec2 uRes; uniform vec3 uTint, uEdge; uniform float uRefract, uChroma, uAbsorb;
float glassA = 1.;
`;
const GLASS_MAIN = `{
  vec2 suv = gl_FragCoord.xy / uRes;
  vec3 vdir = normalize(vViewPosition);
  float edge = 1. - clamp(abs(dot(normal, vdir)), 0., 1.);
  vec2 off = normal.xy * uRefract * (.25 + edge * 1.8);
  vec3 bg = vec3(texture2D(uBuf, suv - off * (1. - uChroma)).r,
                 texture2D(uBuf, suv - off).g,
                 texture2D(uBuf, suv - off * (1. + uChroma)).b);
  float F = .04 + .96 * pow(edge, 5.);
  vec3 tint = mix(uTint, uEdge, smoothstep(.2, .9, edge));
  float tir = smoothstep(.6, .9, edge);                 // a crisp dark outline where light bends away
  outgoingLight += bg * tint * (1. - F) * (1. - tir * uAbsorb);
  glassA = 1. - (1. - texture2D(uBuf, suv - off).a) * (1. - F) * (1. - tir * uAbsorb) * dot(tint, vec3(.333));
}
`;
function makeGlass(buf, res, o) {
  const m = new THREE.MeshPhysicalMaterial({
    color: 0x000000, metalness: 0, roughness: o.rough ?? 0.012, specularIntensity: 1, envMapIntensity: o.env ?? 1.15,
    clearcoat: o.coat ?? 0, clearcoatRoughness: 0.02,
  });
  const u = {
    uBuf: buf, uRes: res,
    uTint: { value: new THREE.Color(...o.tint) }, uEdge: { value: new THREE.Color(...o.edge) },
    uRefract: { value: o.refract }, uChroma: { value: o.chroma }, uAbsorb: { value: o.absorb },
  };
  m.userData.u = u;
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, u);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + GLASS_PARS)
      .replace('#include <opaque_fragment>', GLASS_MAIN + '#include <opaque_fragment>\ngl_FragColor.a = glassA;');
  };
  return m;
}

/* The front plate: everything is seen through it. On top of the refraction it
   adds a faint body tint and haze, a thicker, darker zone and a bright line where
   the plate meets the frame, a broad soft reflection of the studio window, and
   the small marks of real glass (smudges, dust, fine scratches). */
function makeFrontGlass(buf, res, cavU, clear = false) {
  // on the desktop (nothing behind it) the plate is kept clearer and less reflective
  const m = makeGlass(buf, res, { tint: [0.988, 0.992, 0.992], edge: [0.6, 0.64, 0.66], refract: 0.02, chroma: 0.08, absorb: 0.45, coat: clear ? 0.4 : 1, env: clear ? 0.6 : 1.1 });
  const base = m.onBeforeCompile;
  m.onBeforeCompile = sh => {
    base(sh);
    Object.assign(sh.uniforms, cavU);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec2 vPP;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvPP = position.xy;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec2 vPP;\n' + GLSL_NOISE + CAV_GLSL)
      .replace('#include <opaque_fragment>', `{
        float sd = cavSd(vec2(vPP.x * 100. + 120., 230. - vPP.y * 100.)) * .01;   // world units, < 0 inside the cavity
        float rim = smoothstep(-.11, 0., sd) * step(sd, 0.);
        outgoingLight *= 1. - rim * rim * .10;                                 // the glass thickens toward the walls
        outgoingLight *= 1. - .42 * exp(-pow((sd - .003) / .0028, 2.));        // crisp dark line: the cavity wall seen edge-on
        outgoingLight *= 1. - .18 * exp(-pow((sd - .02) / .006, 2.));
        outgoingLight += vec3(.55) * exp(-pow((sd + .005) / .0035, 2.));       // bright line along the cavity wall
        outgoingLight += vec3(.10) * exp(-pow((sd + .03) / .012, 2.));
        outgoingLight += vec3(.06) * exp(-pow((sd - .03) / .02, 2.));          // light caught inside the solid border
        float d = dot(vPP, normalize(vec2(.62, .78)));
        outgoingLight += vec3(.045) * smoothstep(-1.9, -.9, d) * smoothstep(.2, -.6, d);   // soft window reflection
        float sm = smoothstep(.5, .78, fbm(vPP * 2.6 + 7.)) * smoothstep(.25, .75, fbm(vPP * 11. + 3.));
        float dust = step(.9975, hash21(floor(vPP * 150.)));
        float scr = smoothstep(.992, 1., abs(sin(dot(vPP, vec2(.83, .55)) * 700. + fbm(vPP * 18.) * 7.))) * smoothstep(.62, .8, fbm(vPP * 1.7 + 11.));
        outgoingLight += vec3(sm * .012 + dust * .05 + scr * .02);
      }
      #include <opaque_fragment>`);
  };
  return m;
}

/* A solid, puffy glass body around any (star-shaped) outline: a slightly
   domed face, fully rounded sides (no straight extrusion), domed back. */
function makePillow(outlineSim, Dh = 0.30, e = 0.24, bulge = 0.035) {
  const n = outlineSim.length, P = outlineSim.map(p => sw(...p));
  const N = P.map((p, i) => {
    const a = P[(i - 1 + n) % n], b = P[(i + 1) % n];
    let nx = b[1] - a[1], ny = -(b[0] - a[0]); const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    if (nx * p[0] + ny * p[1] < 0) { nx = -nx; ny = -ny; }
    return [nx, ny];
  });
  const O = P.map((p, i) => [p[0] + N[i][0] * BORDER * U, p[1] + N[i][1] * BORDER * U]);
  const rows = [], nf = 12, na = 16;
  for (let k = 0; k <= nf; k++) rows.push({ s: k / nf, z: Dh + bulge * (1 - (k / nf) ** 2) });
  for (let k = 1; k <= na; k++) { const a = k / na * Math.PI / 2; rows.push({ inset: e * (1 - Math.sin(a)), z: Dh - e + e * Math.cos(a) }); }
  if (Dh - e > 1e-4) rows.push({ inset: 0, z: -(Dh - e) });
  for (let k = na - 1; k >= 0; k--) { const a = k / na * Math.PI / 2; rows.push({ inset: e * (1 - Math.sin(a)), z: -(Dh - e + e * Math.cos(a)) }); }
  for (let k = nf - 1; k >= 0; k--) rows.push({ s: k / nf, z: -(Dh + bulge * (1 - (k / nf) ** 2)) });
  const pos = new Float32Array(rows.length * n * 3);
  rows.forEach((r, ri) => {
    for (let i = 0; i < n; i++) {
      const o = O[i], nn = N[i], q = (ri * n + i) * 3;
      if (r.s !== undefined) { pos[q] = (o[0] - nn[0] * e) * r.s; pos[q + 1] = (o[1] - nn[1] * e) * r.s; }
      else { pos[q] = o[0] - nn[0] * r.inset; pos[q + 1] = o[1] - nn[1] * r.inset; }
      pos[q + 2] = r.z;
    }
  });
  const idx = [];
  for (let r = 0; r < rows.length - 1; r++) for (let i = 0; i < n; i++) {
    const a = r * n + i, b = r * n + (i + 1) % n, c = (r + 1) * n + i, d = (r + 1) * n + (i + 1) % n;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  if (g.attributes.normal.getZ(n * 2) < 0) {          // make the faces point outward
    for (let k = 0; k < idx.length; k += 3) { const t = idx[k + 1]; idx[k + 1] = idx[k + 2]; idx[k + 2] = t; }
    g.setIndex(idx); g.computeVertexNormals();
  }
  return g;
}
// the inner walls of the cavity, as a thin glassy band
function makeCavityWall(outlineSim, zc) {
  const n = outlineSim.length, pos = new Float32Array(n * 2 * 3), idx = [];
  outlineSim.forEach((p, i) => {
    const [x, y] = sw(...p);

            <div class="prow" title="左右の角度（タイマーを左右にドラッグでも）">${ICONS.turnL}<input class="yaw" type="range" min="-90" max="90" step="1" value="0">${ICONS.turnR}</div>

    el.innerHTML = `
      <div class="ot-grip" title="ドラッグで移動"></div>

        ${panel}
      </div>`;
    view.stage.overlay.appendChild(el);
    this.panel = el.querySelector('.ot-panel');
    const side = doc.getElementById('side');
    if (side && !view.pinned && !DESKTOP) { side.replaceChildren(this.panel); }
    this.grip = el.querySelector('.ot-grip'); this.hud = el.querySelector('.ot-hud');
    this.tEl = el.querySelector('.ot-time'); this.subEl = el.querySelector('.ot-sub');
    const box = this.panel.querySelector('.ot-custom') || doc.createElement('span'), input = box.querySelector('input') || doc.createElement('input');
    const pipBtn = this.panel.querySelector('[data-a="pip"]');
    if (pipBtn && !view.stage.win.documentPictureInPicture) pipBtn.style.display = 'none';
    const P = this.panel;
    el.querySelector('.ot-flip').addEventListener('click', () => { model.flip(); app.userActed(); app.audio?.(); });
    P.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => { model.setDesign(b.dataset.d); app.syncUi(model); }));
    // rail buttons open one palette at a time
    const closePops = () => { P.querySelectorAll('.pop.open').forEach(x => x.classList.remove('open')); P.querySelectorAll('.rb.on-pop').forEach(x => x.classList.remove('on-pop')); };
    P.querySelectorAll('.rb[data-pop]').forEach(b => b.addEventListener('click', e => {

    }));
    doc.addEventListener('pointerdown', e => { if (!P.contains(e.target)) closePops(); });
    doc.addEventListener('keydown', e => { if (e.key === 'Escape') closePops(); });
    const yawIn = P.querySelector('input.yaw') || doc.createElement('input');
    yawIn.addEventListener('input', () => {
      const vw = model.cfg.view || (model.cfg.view = { yaw: 0, pitch: 0 });
      vw.yaw = -yawIn.value * Math.PI / 180; this.sync(true);
    });
    yawIn.addEventListener('change', () => app.save());
    yawIn.addEventListener('pointerdown', e => e.stopPropagation());
    P.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {

    }));

    }));
    const apply = () => { const v = parseFloat(input.value); if (v > 0) { model.setDuration(Math.round(Math.min(600, Math.max(0.25, v)) * 60)); app.syncUi(model); } };
    input.addEventListener('change', apply);
    input.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { apply(); box.classList.remove('show'); } });
    input.addEventListener('focus', () => el.classList.add('panel-pin'));
    input.addEventListener('blur', () => el.classList.remove('panel-pin'));
    P.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => {
      const a = b.dataset.a;
      if (a === 'flip') { model.flip(); app.userActed(); }
      else if (a === 'sound') { model.cfg.sound = !model.cfg.sound; app.syncUi(model); app.save(); }
      else if (a === 'glitter') { model.cfg.glitter = !model.cfg.glitter; model.views.forEach(v => v.applyPalette()); app.syncUi(model); app.save(); }
      else if (a === 'smaller') DESKTOP ? native({ type: 'size', k: 1 / 1.12 }) : app.rescale(model, 1 / 1.12);
      else if (a === 'bigger') DESKTOP ? native({ type: 'size', k: 1.12 }) : app.rescale(model, 1.12);
      else if (a === 'quit') { app.save(); native({ type: 'close' }); }
      else if (a === 'pip') app.togglePiP(model);
      else if (a === 'close') app.remove(model);
    }));
    const grip = this.grip;
    grip.addEventListener('pointerdown', e => {
      e.preventDefault(); grip.setPointerCapture(e.pointerId);
      this.move = { x: e.clientX, y: e.clientY, ox: model.cfg.x, oy: model.cfg.y };
      el.classList.add('moving');
    });
    grip.addEventListener('pointermove', e => {
      if (!this.move) return;
      if (DESKTOP) {          // move the desktop window itself
        native({ type: 'move', dx: e.screenX - (this.move.sx ?? e.screenX), dy: e.screenY - (this.move.sy ?? e.screenY) });
        this.move.sx = e.screenX; this.move.sy = e.screenY;
        return;
      }
      const k = view.stage.worldPerPixel();
      model.cfg.x = this.move.ox + (e.clientX - this.move.x) * k;
      model.cfg.y = this.move.oy - (e.clientY - this.move.y) * k;
      app.clampPos(model);
    });
    const end = () => { if (this.move) { this.move = null; el.classList.remove('moving'); app.save(); } };
    grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
    this.sync();
  }
  sync(fromSlider = false) {
    const model = this.view.model, cfg = model.cfg, m = cfg.duration / 60, P = this.panel;
    let matched = false;
    P.querySelectorAll('[data-m]').forEach(b => {
      const on = b.dataset.m !== 'custom' && +b.dataset.m === m;
      matched = matched || on; b.classList.toggle('on', on);
    });
    P.querySelector('[data-m="custom"]')?.classList.toggle('on', !matched);
    P.querySelector('[data-a="sound"]')?.classList.toggle('off', !cfg.sound);
    P.querySelector('[data-a="glitter"]')?.classList.toggle('on', !!cfg.glitter);
    P.querySelectorAll('[data-d]').forEach(b => b.classList.toggle('on', b.dataset.d === cfg.design));
    P.querySelectorAll('[data-p]').forEach(b => b.classList.toggle('on', b.dataset.p === cfg.palette));
    const vw = cfg.view || { yaw: 0, pitch: 0 };
    P.querySelectorAll('[data-v]').forEach(b => { const v = VIEWS.find(x => x.id === b.dataset.v); b.classList.toggle('on', Math.abs(v.yaw - vw.yaw) < 0.02 && Math.abs(v.pitch - vw.pitch) < 0.02); });
    const yi = P.querySelector('input.yaw'); if (yi && document.activeElement !== yi) yi.value = Math.round(-vw.yaw * 180 / Math.PI);
    // the rail shows what is chosen
    const cd = P.querySelector('.cur-design'); if (cd && cd.dataset.d !== cfg.design) { cd.innerHTML = designIcon(cfg.design); cd.dataset.d = cfg.design; }
    const cc = P.querySelector('.cur-color'); if (cc) cc.style.background = this.swatch(cfg.palette);
    const cm = P.querySelector('.cur-min'); if (cm) cm.textContent = +m.toFixed(1);
  }
  update() {
    const v = this.view, model = v.model, st = v.stage;
    const [x, y] = v.pos(), s = v.scale();
    const top = st.project(x, y + (H * U / 2 + 0.4) * s), bottom = st.project(x, y - (H * U / 2 + 0.22) * s);
    this.grip.style.left = top[0] + 'px'; this.grip.style.top = top[1] + 'px';
    this.hud.style.left = bottom[0] + 'px'; this.hud.style.top = bottom[1] + 'px';
    const shown = model.done ? '00:00' : (model.wasRunning || model.anyTop) ? fmt(model.remaining) : '--:--';
    if (shown !== this._shown) { this.tEl.textContent = shown; this._shown = shown; }
    const sub = model.done ? `おしまい · ${durLabel(model.cfg.duration)}が経ちました` : model.wasRunning ? `${durLabel(model.cfg.duration)} タイマー` : model.settled() ? 'ひっくり返してスタート' : '';
    if (sub !== this._sub) { this.subEl.textContent = sub; this._sub = sub; }
    this.el.classList.toggle('done', model.done);
    this.el.classList.toggle('ready', model.done || (!model.wasRunning && model.settled()));
  }
}

/* =====================================================================
   7. Stage: one renderer + studio scene (page or floating window)
   ===================================================================== */
class Stage {
  constructor(app, win, { pip = false, transparent = false } = {}) {
    this.app = app; this.win = win; this.doc = win.document; this.pip = pip; this.transparent = transparent;
    this.padBottom = transparent ? 112 : pip ? 0 : 92;      // px kept free below the timer (desktop controls)
    const canvas = this.canvas = this.doc.createElement('canvas');
    canvas.className = 'stage';
    this.doc.body.prepend(canvas);
    this.overlay = this.doc.createElement('div'); this.overlay.className = 'overlay';
    canvas.after(this.overlay);
    const r = this.renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: transparent, premultipliedAlpha: true, powerPreference: 'high-performance' });
    this.pr = Math.min(win.devicePixelRatio || 1, 2);
    r.setPixelRatio(this.pr);
    r.toneMapping = THREE.NeutralToneMapping;
    r.toneMappingExposure = 0.95;
    const scene = this.scene = new THREE.Scene();
    scene.environment = studioEnvironment(r);
    loadHdri().then(tex => {
      const pm = new THREE.PMREMGenerator(r);
      scene.environment = pm.fromEquirectangular(tex).texture;
      scene.environmentRotation.set(0, THREE.MathUtils.degToRad(-35), 0);
      pm.dispose();
    }).catch(() => {});
    this.hemi = new THREE.HemisphereLight(0xffffff, 0xd8dce2, 1.0); scene.add(this.hemi);
    this.camera = new THREE.PerspectiveCamera(22, 1, 0.1, 100);
    this.wall = new THREE.Mesh(new THREE.PlaneGeometry(90, 70), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0 }));
    this.wall.position.z = WALL_Z; this.wall.renderOrder = -1;
    scene.add(this.wall);
    this.spot = new THREE.SpotLight(0xffffff, 30, 0, 0.55, 1, 2);
    this.spot.position.set(-2.2, 3.4, 9); this.spot.target.position.set(0.4, -0.4, WALL_Z);
    scene.add(this.spot, this.spot.target);
    const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(-3, 5, 6); scene.add(key);
    const rim = new THREE.DirectionalLight(0xffffff, 0.7); rim.position.set(4, 1.5, 5); scene.add(rim);

    // what lies behind each layer, for refraction
    const rtOpts = { type: THREE.HalfFloatType, depthBuffer: true };
    this.bufA = new THREE.WebGLRenderTarget(4, 4, rtOpts);
    this.bufB = new THREE.WebGLRenderTarget(4, 4, rtOpts);
    this.bufC = new THREE.WebGLRenderTarget(4, 4, rtOpts);
    this.uBufA = { value: this.bufA.texture }; this.uBufB = { value: this.bufB.texture }; this.uBufC = { value: this.bufC.texture };
    this.uRes = { value: new THREE.Vector2(4, 4) };
    // final image: MSAA, gentle bloom on highlights, film grain and vignette, then tone mapping
    this.composer = new EffectComposer(r, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 }));
    this.composer.addPass(new RenderPass(scene, this.camera));
    this.bloom = new UnrealBloomPass(new THREE.Vector2(4, 4), 0.06, 0.4, 0.95);
    this.composer.addPass(this.bloom);
    this.grain = new ShaderPass(GRAIN_SHADER);
    this.composer.addPass(this.grain);
    this.composer.addPass(new OutputPass());

    this.views = [];
    this.cam = { x: 0, y: 0 }; this.ptr = null; this.t0 = win.performance.now();
    this.ray = new THREE.Raycaster(); this.plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    this.applyTheme();
    this.resize();
    win.addEventListener('resize', () => this.resize());
    this.bindPointer();
  }
  applyTheme() {
    const th = THEMES[this.app.theme];
    this.wall.material.color.setHex(th.wall);
    this.renderer.setClearColor(th.clear, this.transparent ? 0 : 1);
    this.wall.visible = !this.transparent;
    this.bloom.enabled = this.grain.enabled = !this.transparent;
    this.scene.environmentIntensity = th.env;
    this.spot.intensity = th.spot; this.hemi.intensity = th.hemi;
    this.bloom.strength = th.bloom;
    this.views.forEach(v => v.applyTheme());
  }
  setQuality(pr) { this.pr = pr; this.renderer.setPixelRatio(pr); this.resize(); }
  resize() {
    const w = this.win.innerWidth, h = this.win.innerHeight, pr = this.pr;
    // narrow page: the dock sits under the timer too, keep it clear
    if (!this.pip && !this.transparent) this.padBottom = 100 + (w < 640 ? 72 : 0);
    this.renderer.setSize(w, h, false);
    this.composer.setPixelRatio(pr);
    this.composer.setSize(w, h);
    const bw = Math.round(w * pr), bh = Math.round(h * pr);
    this.bufA.setSize(bw, bh); this.bufB.setSize(bw, bh); this.bufC.setSize(bw, bh);
    this.uRes.value.set(bw, bh);
    this.camera.aspect = w / h;
    this.viewH = this.pip ? Math.max(5.3, 2.9 / this.camera.aspect) : Math.max(7.2, 3.4 / this.camera.aspect);
    this.dist = this.viewH / 2 / Math.tan(THREE.MathUtils.degToRad(this.camera.fov / 2));
    this.camera.updateProjectionMatrix();
    if (!this.pip) this.app.models?.forEach(m => this.app.clampPos(m));
  }
  worldPerPixel() { return this.viewH / this.win.innerHeight; }
  project(x, y) {
    const v = new THREE.Vector3(x, y, 0).project(this.camera);
    return [(v.x + 1) / 2 * this.win.innerWidth, (1 - v.y) / 2 * this.win.innerHeight];
  }
  toWorld(e) {
    const ndc = new THREE.Vector2(e.clientX / this.win.innerWidth * 2 - 1, -(e.clientY / this.win.innerHeight) * 2 + 1);
    this.ray.setFromCamera(ndc, this.camera);
    const p = new THREE.Vector3();
    return this.ray.ray.intersectPlane(this.plane, p) ? p : null;
  }
  viewAt(e) {
    const ndc = new THREE.Vector2(e.clientX / this.win.innerWidth * 2 - 1, -(e.clientY / this.win.innerHeight) * 2 + 1);
    this.ray.setFromCamera(ndc, this.camera);
    const p = new THREE.Vector3(), n = new THREE.Vector3(), o = new THREE.Vector3(), pl = new THREE.Plane();
    for (let i = this.views.length - 1; i >= 0; i--) {
      const v = this.views[i]; if (!v.root.visible) continue;
      v.group.updateMatrixWorld();
      n.set(0, 0, 1).transformDirection(v.group.matrixWorld); o.setFromMatrixPosition(v.group.matrixWorld);
      pl.setFromNormalAndCoplanarPoint(n, o);
      if (Math.abs(n.dot(this.ray.ray.direction)) > 0.15 && this.ray.ray.intersectPlane(pl, p) && v.contains(p)) return v;
      // seen edge-on: accept clicks near its silhouette on screen
      const [cx, cy] = this.project(...v.pos()), hpx = H * U / 2 * v.scale() / this.worldPerPixel();
      if (Math.abs(n.z) < 0.4 && Math.abs(e.clientX - cx) < 60 && Math.abs(e.clientY - cy) < hpx) return v;
    }
    return null;
  }
  bindPointer() {
    const c = this.canvas, win = this.win;
    c.addEventListener('contextmenu', e => { if (this.viewAt(e) || this.orbit) e.preventDefault(); });
    c.addEventListener('pointermove', e => {
      this.ptr = { x: e.clientX, y: e.clientY };
      if (this.orbit) {
        const o = this.orbit, vw = o.v.model.cfg.view;
        vw.yaw = Math.max(-1.57, Math.min(1.57, o.yaw + (e.clientX - o.x) * 0.008));
        if (!o.yawOnly) vw.pitch = Math.max(-0.7, Math.min(0.7, o.pitch + (e.clientY - o.y) * 0.006));
        o.v.ui.sync();
        return;
      }
      if (this.pending) {
        const pd = this.pending, dx = e.clientX - pd.x, dy = e.clientY - pd.y;
        if (Math.hypot(dx, dy) < 6) return;
        this.pending = null;
        if (Math.abs(dx) > Math.abs(dy) * 1.3) {
          const vw = pd.v.model.cfg.view || (pd.v.model.cfg.view = { yaw: 0, pitch: 0 });
          this.orbit = { v: pd.v, x: pd.x, y: pd.y, yaw: vw.yaw, pitch: vw.pitch, yawOnly: true };
        } else {
          pd.v.model.dragStart(pd.x, pd.y, pd.t);
          this.drag = pd.v;
        }
      }
      if (this.drag) {
        const v = this.drag, [cx, cy] = this.project(...v.pos());
        v.model.dragMove(e.clientX, e.clientY, cx, cy, win.performance.now());
        return;
      }
      const v = this.viewAt(e);
      c.style.cursor = v ? 'grab' : '';
      this.views.forEach(x => x.ui.el.classList.toggle('hover', x === v));
    });
    c.addEventListener('pointerleave', () => { this.ptr = null; });
    c.addEventListener('pointerdown', e => {
      if (e.button === 2 || (e.button === 0 && e.shiftKey)) {
        const v = this.viewAt(e); if (!v) return;
        e.preventDefault(); c.setPointerCapture(e.pointerId);
        const vw = v.model.cfg.view || (v.model.cfg.view = { yaw: 0, pitch: 0 });
        this.orbit = { v, x: e.clientX, y: e.clientY, yaw: vw.yaw, pitch: vw.pitch }; c.style.cursor = 'move';
        v.ui.sync();
        return;
      }
      if (e.button !== 0) return;
      const v = this.viewAt(e); if (!v) return;
      e.preventDefault(); c.setPointerCapture(e.pointerId);
      // the direction of the first movement decides: vertical = flip the timer, horizontal = look at its depth
      this.pending = { v, x: e.clientX, y: e.clientY, t: win.performance.now() };
      c.style.cursor = 'grabbing';
      this.app.front = v.model; this.app.userActed(); this.app.audio();
      this.views.splice(this.views.indexOf(v), 1); this.views.push(v);
    });
    const up = () => {
      if (this.pending) { this.pending = null; c.style.cursor = 'grab'; }
      if (this.orbit) { const v = this.orbit.v; this.orbit = null; c.style.cursor = ''; v.ui.sync(); this.app.save(); }
      if (this.drag) { this.drag.model.dragEnd(win.performance.now()); this.drag = null; c.style.cursor = 'grab'; }
    };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    c.addEventListener('dblclick', e => { const v = this.viewAt(e); if (v) { v.model.flip(); this.app.userActed(); } });
    c.addEventListener('wheel', e => {
      if (!e.ctrlKey && !e.metaKey) return;
      const v = this.viewAt(e); if (!v || this.pip) return;
      e.preventDefault(); this.app.rescale(v.model, e.deltaY < 0 ? 1.05 : 1 / 1.05);
    }, { passive: false });
  }
  addView(model, pinned) { const v = new TimerView(this, model, pinned); this.views.push(v); model.views.add(v); return v; }
  removeView(v) { v.dispose(); this.views = this.views.filter(x => x !== v); v.model.views.delete(v); }
  render() {
    const t = (this.win.performance.now() - this.t0) / 1000;
    // fixed camera: the scene does not move with the pointer
    const cam = this.camera, r = this.renderer;
    const oy = this.padBottom * this.viewH / this.win.innerHeight / 2;
    cam.position.set(0, -oy, this.dist);
    cam.lookAt(0, -oy, 0);
    cam.updateMatrixWorld();
    TIME.value = t;
    this.grain.uniforms.uTime.value = t % 100;
    for (const v of this.views) if (v.root.visible) v.update(r, t, this.ptr);
    // layered passes: back -> + blue -> + front -> + glass case (final, through the composer)
    cam.layers.set(L_BACK);
    r.setRenderTarget(this.bufA); r.clear(); r.render(this.scene, cam);
    cam.layers.enable(L_BLUE);
    r.setRenderTarget(this.bufB); r.clear(); r.render(this.scene, cam);
    cam.layers.enable(L_FRONT);
    r.setRenderTarget(this.bufC); r.clear(); r.render(this.scene, cam);
    cam.layers.enable(L_GLASS);
    r.setRenderTarget(null);
    this.composer.render();
  }
  dispose() {
    this.views.slice().forEach(v => this.removeView(v));
    this.bufA.dispose(); this.bufB.dispose(); this.bufC.dispose(); this.composer.dispose(); this.renderer.dispose();
  }
}
/* =====================================================================
   8. App: timers, persistence, theme, chime, floating window
   ===================================================================== */
const STORE = DESKTOP ? 'oil-timer-desk' : 'oil-timer-v4';
const App = {
  models: [], theme: 'light', pip: null,
  init() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) {}
    this.theme = saved?.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = this.theme;
    if (DESKTOP) {
      // just the timer on a transparent window; settings may come from the page that opened it
      const q = new URLSearchParams(location.search), cfg = Object.assign({}, saved?.timers?.[0]?.cfg);
      if (q.get('design') && DESIGN_DEFS[q.get('design')]) cfg.design = q.get('design');
      if (q.get('palette') && PALETTES[q.get('palette')]) cfg.palette = q.get('palette');
      if (+q.get('duration') > 0) cfg.duration = +q.get('duration');
      this.stage = new Stage(this, window, { pip: true, transparent: true });
      const same = saved?.timers?.[0] && saved.timers[0].cfg.design === cfg.design;
      const m = new TimerModel(this, { cfg, state: same ? saved.timers[0].state : null, fresh: !same });
      this.models.push(m); this.stage.addView(m, true); this.front = m; this.acted = true;
    } else {
    this.stage = new Stage(this, window);
    if (saved?.timers?.length) {
      this.add({ cfg: saved.timers[0].cfg, state: saved.timers[0].state });
      document.getElementById('hint').classList.add('hidden'); this.acted = true;
    } else this.add({ fresh: true });
    }
    // place on the desktop: the Mac app (no background) or the browser's floating window
    const side = document.getElementById('side');
    document.getElementById('setBtn').onclick = e => { e.stopPropagation(); side.classList.toggle('show'); };
    addEventListener('click', e => { if (!side.contains(e.target) && !e.target.closest('#setBtn')) side.classList.remove('show'); });
    const menu = document.getElementById('deskMenu');
    document.getElementById('deskBtn').onclick = e => { e.stopPropagation(); menu.classList.toggle('show'); };
    addEventListener('click', e => { if (!menu.contains(e.target)) menu.classList.remove('show'); });
    // the desktop app (Mac / Windows) opens through the oiltimer:// link; if nothing
    // answers (the page keeps focus), offer the download instead
    const getApp = document.getElementById('getApp');
    addEventListener('click', e => { if (!getApp.contains(e.target) && !e.target.closest('#deskApp')) getApp.classList.remove('show'); });
    const isWin = /Windows/.test(navigator.userAgent);
    document.getElementById(isWin ? 'dlMac' : 'dlWin').style.opacity = '.55';
    document.getElementById('deskApp').onclick = () => {
      const m = this.front || this.models[0], c = m.cfg;
      this.save();
      menu.classList.remove('show');
      let left = false;
      const away = () => { left = true; };
      addEventListener('blur', away); document.addEventListener('visibilitychange', away);
      location.href = `oiltimer://open?design=${c.design}&palette=${c.palette}&duration=${c.duration}`;
      setTimeout(() => {
        removeEventListener('blur', away); document.removeEventListener('visibilitychange', away);
        if (!left) getApp.classList.add('show');
      }, 1500);
    };
    if (!window.documentPictureInPicture) document.getElementById('deskPip').style.display = 'none';
    document.getElementById('deskPip').onclick = () => { menu.classList.remove('show'); this.togglePiP(this.front || this.models[0]); };
    document.getElementById('themeBtn').onclick = () => this.setTheme(this.theme === 'dark' ? 'light' : 'dark');
    document.getElementById('fsBtn').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
    addEventListener('keydown', e => this.onKey(e));
    addEventListener('pagehide', () => this.save());
    setInterval(() => this.save(), 4000);
    setInterval(() => this.updateTitle(), 500);
    document.addEventListener('visibilitychange', () => this.onVisibility());
    this.last = performance.now();
    this.frame = this.frame.bind(this);
    this.schedule();
    setTimeout(() => document.getElementById('loading').classList.add('gone'), 300);
  },
  onKey(e) {
    if (e.code === 'Space' && !e.repeat && e.target?.tagName !== 'INPUT') {
      e.preventDefault(); (this.front || this.models[0])?.flip(); this.userActed();
    }
  },
  schedule() {
    const w = this.pip && !this.pip.win.closed ? this.pip.win : window;
    w.requestAnimationFrame(this.frame);
  },
  frame() {
    const now = performance.now();
    const dt = (now - this.last) / 1000; this.last = now;
    // keep it smooth: lower the render resolution step by step if frames are slow
    if (dt < 0.25 && !document.hidden) {
      this.ft = (this.ft ?? 1 / 60) * 0.97 + dt * 0.03;
      this.ftN = (this.ftN || 0) + 1;
      if (this.ftN > 120 && this.ft > 1 / 38 && this.stage.pr > 1) { this.stage.setQuality(Math.max(1, this.stage.pr - 0.25)); this.ftN = 0; }
    }
    for (const m of this.models) m.update(dt);
    this.stage.render();
    if (this.pip) this.pip.stage.render();
    this.schedule();
  },
  add({ cfg, state, fresh }) {
    const m = new TimerModel(this, { cfg, state, fresh });
    this.models.push(m);
    this.stage.addView(m, false);
    this.front = m;
    return m;
  },
  syncUi(m) { m.views.forEach(v => v.ui.sync()); },
  remove(m) {
    if (this.models.length <= 1) { this.tip('最後のタイマーは削除できません'); return; }
    [...m.views].forEach(v => v.stage.removeView(v));
    this.models = this.models.filter(x => x !== m); this.save();
  },
  rescale(m, k) { m.cfg.scale = Math.max(0.5, Math.min(1.6, m.cfg.scale * k)); this.clampPos(m); this.save(); },
  clampPos(m) {
    const st = this.stage; if (!st?.viewH) return;
    const hw = st.viewH * st.camera.aspect / 2, hh = st.viewH / 2;
    m.cfg.x = Math.max(-hw + 0.6, Math.min(hw - 0.6, m.cfg.x));
    m.cfg.y = Math.max(-hh + 0.8, Math.min(hh - 0.8, m.cfg.y));
  },
  userActed() {
    if (this.acted) return;
    this.acted = true;
    setTimeout(() => document.getElementById('hint').classList.add('hidden'), 2500);
  },
  setTheme(th) {
    this.theme = th;
    document.documentElement.dataset.theme = th;
    this.stage.applyTheme();
    if (this.pip) { this.pip.win.document.documentElement.dataset.theme = th; this.pip.stage.applyTheme(); }
    this.save();
  },
  save() {
    try { localStorage.setItem(STORE, JSON.stringify({ theme: this.theme, timers: this.models.map(m => ({ cfg: m.cfg, state: m.serialize() })) })); } catch (e) {}
  },
  tip(msg) {
    const el = document.getElementById('tip');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(this._tip); this._tip = setTimeout(() => el.classList.remove('show'), 2400);
  },
  updateTitle() {
    const live = this.models.find(m => m.wasRunning);
    document.title = live ? `${fmt(live.remaining)} · Oil Timer` : 'Oil Timer';
  },
  onVisibility() {
    clearTimeout(this._bgChime);
    if (!document.hidden || this.pip) return;
    let soonest = Infinity, who = null;
    for (const m of this.models) {
      if (!m.wasRunning || !m.cfg.sound) continue;
      const r = m.remainingFromState();
      if (r < soonest) { soonest = r; who = m; }
    }
    if (who && soonest < 36000) this._bgChime = setTimeout(() => { if (document.hidden) { who.chimedEarly = true; this.chime(); } }, soonest * 1000 + 600);
  },
  audio() {
    if (!this.ac) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ac = new AC(); }
    if (this.ac?.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  chime() {
    const ac = this.audio(); if (!ac) return;
    const t0 = ac.currentTime + 0.05;
    const master = ac.createGain(); master.gain.value = 0.22; master.connect(ac.destination);
    const bell = (f, t, vol) => {
      [[1, 1, 3.2], [2.76, 0.35, 1.6], [5.4, 0.12, 0.8], [0.5, 0.18, 2.4]].forEach(([mul, amp, dec]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f * mul;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp * vol, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
        o.connect(g).connect(master); o.start(t); o.stop(t + dec + 0.1);
      });
    };
    bell(659.25, t0, 1); bell(880, t0 + 0.9, 0.8); bell(659.25, t0 + 2.2, 0.6);
  },
  async togglePiP(m) {
    if (this.pip) { const same = this.pip.model === m; this.pip.win.close(); if (same) return; }
    if (!window.documentPictureInPicture) { this.tip('このブラウザはフローティング表示に未対応です（Chrome / Edge を推奨）'); return; }
    this.audio();
    let win;
    try { win = await documentPictureInPicture.requestWindow({ width: 230, height: 470 }); }
    catch (e) { this.tip('フローティング表示を開けませんでした'); return; }
    const d = win.document;
    d.documentElement.lang = 'ja'; d.documentElement.dataset.theme = this.theme; d.title = 'Oil Timer';
    const font = d.createElement('link'); font.rel = 'stylesheet'; font.href = document.getElementById('font-link').href; d.head.append(font);
    const st = d.createElement('style'); st.textContent = document.getElementById('app-style').textContent; d.head.append(st);
    d.body.className = 'pip';
    const stage = new Stage(this, win, { pip: true });
    stage.addView(m, true);
    [...m.views].filter(v => v.stage === this.stage).forEach(v => v.setVisible(false));
    win.addEventListener('keydown', e => this.onKey(e));
    this.pip = { win, stage, model: m };
    win.addEventListener('pagehide', () => {
      stage.dispose();
      [...m.views].filter(v => v.stage === this.stage).forEach(v => v.setVisible(true));
      this.pip = null;
    });
  },
};

const ok = (() => { try { return !!document.createElement('canvas').getContext('webgl2'); } catch (e) { return false; } })();
if (ok && DESKTOP) setTimeout(() => {
  const m = App.models[0], gl = App.stage.renderer.getContext();
  native({ type: 'log', msg: `ready design=${m?.cfg.design} remaining=${m?.remaining.toFixed(1)} webgl2=${gl instanceof WebGL2RenderingContext} size=${innerWidth}x${innerHeight} env=${!!App.stage.scene.environment}` });
}, 6000);
if (ok) { App.init(); window.App = App; window.DESIGN_DEFS = DESIGN_DEFS; window.getDesign = getDesign; window.inRegion = inRegion; }
else document.getElementById('loading').textContent = 'このブラウザでは WebGL2 が使えません';
</script>
